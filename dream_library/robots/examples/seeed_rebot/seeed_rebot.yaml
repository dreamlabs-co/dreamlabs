# The Seeed reBot B601-DM on its FaaS fine-tune: configs/custom.example.yaml filled in, with seeed_rebot.py beside it.
#
# First, nothing switched on:  set custom.driver to seeed_rebot.py:ReadOnlyArm, then
#   dreamcli robot run --config seeed_rebot.yaml --checkpoint <your fine-tune> --task "..." --dry-run
# It logs what each arm reads; copy each arm's reading at rest into its `home` below. Then seeed_rebot.py:Arm, without
# --dry-run, with a person at the e-stop.

body: custom

custom:
  driver: seeed_rebot.py:Arm
  # dream's model of this arm: B601's chain and tool, the fine-tune data's rest pose and speeds.
  ik: seeed_faas
  # The embodiment the fine-tune was trained on, <username>/<name> as dream.DreamClient().get_embodiments() lists it.
  embodiment: <username>/<name>
  # No grip_scale: the dream client sends <side>_gripper (0 shut to 1 open, as recorded) from the grip.

# Pinned by USB port: the two arms' adapters share one serial, so /dev/ttyACM* can swap them. Yours: ls -l /dev/serial/by-path/.
# `home` is required: one joint angle per joint in radians (the reBot's six), where every run starts and ends; the
# dry run logs them.
follower_r:
  can_channel: /dev/serial/by-path/pci-0000:67:00.3-usb-0:1.2.4:1.0
  home: null
follower_l:
  can_channel: /dev/serial/by-path/pci-0000:67:00.3-usb-0:1.2.1:1.0
  home: null

# The roles the fine-tune's data recorded: head = observation.images.top, wrist_l = .left, wrist_r = .right.
# 16:9, as the model takes 640x360: the head webcam sends 1280x720 at 30 fps, a D405 wrist at 15 (the model reads 5).
cameras:
  - {name: head, device: 0, width: 1280, height: 720, fps: 30}
  - {name: wrist_l, device: 2, width: 1280, height: 720, fps: 15}
  - {name: wrist_r, device: 4, width: 1280, height: 720, fps: 15}

task: "pick up the cup and place it on the plate"

# Recorded at 30 fps, played at 20 Hz, every body's action rate. 48 rows per reply, 9 frames at 5 fps.
control_hz: 20
action_horizon: 48
stale_after_s: 0.2
max_stall_ticks: 240
obs_window: 9
obs_fps: 5.0
max_ee_speed_m_s: 0.6
# The grip force cap reads a gripper effort, which this driver does not report.
grip_force_cap: 0
